<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="680" height="480" rx="18" fill="#ffffff"/>
  <text x="340" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">Rufus: How to Choose Partition Scheme &amp; Target System</text>

  <!-- 起点 -->
  <rect x="220" y="64" width="240" height="56" rx="12" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933">What firmware does your PC use?</text>
  <text x="340" y="110" text-anchor="middle" font-size="12" fill="#52606d">Check BIOS/UEFI settings or motherboard year</text>

  <!-- 左分支：UEFI -->
  <path d="M290 120 L170 170" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M390 120 L510 170" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="30" y="172" width="280" height="104" rx="12" fill="#eafaf0" stroke="#22a06b" stroke-width="2"/>
  <text x="170" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b3a">Modern PC (2015+ / UEFI)</text>
  <text x="170" y="224" text-anchor="middle" font-size="13" fill="#1f2933">Partition scheme: GPT</text>
  <text x="170" y="246" text-anchor="middle" font-size="13" fill="#1f2933">Target system: UEFI (non-CSM)</text>
  <text x="170" y="268" text-anchor="middle" font-size="12" fill="#52606d">Default for modern boards; faster &amp; safer</text>

  <!-- 右分支：BIOS -->
  <rect x="370" y="172" width="280" height="104" rx="12" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/>
  <text x="510" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#a85200">Old PC (Legacy BIOS only)</text>
  <text x="510" y="224" text-anchor="middle" font-size="13" fill="#1f2933">Partition scheme: MBR</text>
  <text x="510" y="246" text-anchor="middle" font-size="13" fill="#1f2933">Target system: BIOS or UEFI-CSM</text>
  <text x="510" y="268" text-anchor="middle" font-size="12" fill="#52606d">Best compatibility on old machines</text>

  <!-- 汇合 -->
  <path d="M170 276 L340 330" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510 276 L340 330" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="180" y="332" width="320" height="64" rx="12" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">File system: NTFS</text>
  <text x="340" y="380" text-anchor="middle" font-size="12" fill="#52606d">Win11 image &gt;4GB, NTFS is required</text>

  <path d="M340 396 L340 430" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="250" y="430" width="180" height="36" rx="18" fill="#3b82f6"/>
  <text x="340" y="453" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Click "START"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa5b1"/>
    </marker>
  </defs>
</svg>
